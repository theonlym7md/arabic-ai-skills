case_id: auth_otp_error
domain: Auth_Security
runner_mode: sdk
sdk_input:
  textType: OTP error title, description, and CTA
  maxLength: 30
  targetAudience: Arabic mobile users
  toneOfVoice: Clear and calm
target_metrics:
  Trust: 100
  Clarity: 95
forbidden_phrases:
  - خلال 5 دقائق
  - لقد أخطأت
  - حاول لاحقًا
review_criteria:
  - States clearly that the verification code expired without blaming the user.
  - Uses only the available resend action and invents no expiry duration.
