case_id: uncertain_payment
domain: Payments_Uncertain
runner_mode: sdk
sdk_input:
  textType: Payment status title, description, and CTA
  maxLength: 35
  targetAudience: Arabic checkout users
  toneOfVoice: Calm and reassuring
target_metrics:
  Clarity: 95
forbidden_phrases:
  - لم يُخصم
  - أعد الدفع
  - استرداد خلال
review_criteria:
  - Acknowledges unknown status rather than confirmed failure.
  - Uses only the supplied status-check action; never encourages duplicate
    payment.
