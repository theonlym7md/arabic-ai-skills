case_id: luxury_hospitality
domain: Luxury
runner_mode: sdk
sdk_input:
  textType: Hospitality card title, description, and CTA
  maxLength: 40
  targetAudience: Luxury hospitality guests
  toneOfVoice: Refined and calm
target_metrics:
  Trust: 100
  Brand: 95
  Clarity: 95
forbidden_phrases:
  - أفخم
  - أسطوري
  - لا مثيل له
  - إلغاء مجاني
  - خصم حصري
review_criteria:
  - Uses calm editorial restraint with concrete hospitality details instead of
    exaggerated adjectives.
  - Does not invent free cancellation, unverified discounts, or guaranteed
    privilege access.
  - Keeps the heading and CTA button free of trailing periods.
